<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Drive Simulator TH 🇹🇭</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;font-family:Arial,"Noto Sans Thai",sans-serif;color:#fff;
      background:radial-gradient(circle at 50% 15%,rgba(30,80,220,.38),transparent 35%),
      linear-gradient(135deg,#030407,#0a1020 55%,#030407);
    }
    .card{
      width:min(430px,100%);text-align:center;padding:34px 24px 28px;
      border:1px solid rgba(255,255,255,.14);border-radius:28px;
      background:rgba(8,11,20,.82);box-shadow:0 20px 70px rgba(0,0,0,.6);
      backdrop-filter:blur(14px);
    }
    .logo{
      width:190px;height:190px;object-fit:cover;border-radius:50%;
      display:block;margin:0 auto 22px;
      box-shadow:0 0 22px rgba(25,75,255,.45),0 0 55px rgba(255,20,55,.16);
    }
    h1{
      margin:0 0 10px;font-size:27px;font-weight:900;letter-spacing:.3px;
      background:linear-gradient(90deg,#fff,#d9e4ff,#fff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 0 24px rgba(80,130,255,.25);
    }
    .flag{font-size:25px;vertical-align:2px}
    .line{
      width:105px;height:3px;margin:0 auto 14px;border-radius:99px;
      background:linear-gradient(90deg,#e51b35,#fff,#2455d8);
    }
    p{margin:0 0 24px;color:#bfc7d8;line-height:1.65}
    .btn{
      display:block;text-decoration:none;color:#fff;font-weight:900;
      padding:16px 18px;border-radius:15px;
      background:linear-gradient(135deg,#5865f2,#3f4dcc);
      box-shadow:0 10px 30px rgba(88,101,242,.3);
      transition:.2s;
    }
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .small{margin-top:18px;font-size:11px;color:#697286;letter-spacing:1.5px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Drag Drive Simulator TH">
    <h1>Drag Drive Simulator TH <span class="flag">🇹🇭</span></h1>
    <div class="line"></div>
    <p>Discord Community สำหรับคนไทย<br>คุยกัน • เล่นด้วยกัน • หาเพื่อน</p>
    <a class="btn" href="https://discord.gg/uBGdj6Dsj" target="_blank" rel="noopener noreferrer">
      💬 เข้า Discord
    </a>
    <div class="small">THAILAND DISCORD COMMUNITY</div>
  </main>
</body>
</html>
