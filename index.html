<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag Drive Simulator TH 🇹🇭</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
font-family:Arial,"Noto Sans Thai",sans-serif;
color:white;
background:
radial-gradient(circle at 50% 10%,#123b91 0%,transparent 35%),
linear-gradient(135deg,#020617,#061334 55%,#020617);
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}
.container{
width:100%;
max-width:520px;
text-align:center;
}
.card{
background:rgba(8,15,32,.88);
border:1px solid rgba(100,150,255,.25);
border-radius:28px;
padding:30px 22px;
box-shadow:0 20px 70px rgba(0,0,0,.55);
}
.logo{
width:190px;
height:190px;
object-fit:cover;
border-radius:50%;
margin:0 auto 22px;
display:block;
box-shadow:0 0 30px rgba(60,120,255,.5);
}
h1{
margin:0 0 10px;
font-size:29px;
font-weight:900;
background:linear-gradient(90deg,#fff,#8bbcff,#fff);
-webkit-background-clip:text;
color:transparent;
}
.line{
width:110px;
height:4px;
margin:14px auto 20px;
border-radius:99px;
background:linear-gradient(90deg,#ff315d,#fff,#376cff);
}
.desc{
color:#bfcbe3;
line-height:1.7;
font-size:16px;
margin-bottom:25px;
}
.discord{
display:block;
text-decoration:none;
color:white;
font-size:18px;
font-weight:800;
padding:17px;
border-radius:16px;
background:linear-gradient(135deg,#5865f2,#3f4dcc);
box-shadow:0 10px 30px rgba(88,101,242,.35);
transition:.2s;
}
.discord:active{
transform:scale(.97);
}
.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;
}
.feature{
padding:18px 10px;
border-radius:18px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.08);
}
.icon{
font-size:28px;
margin-bottom:7px;
}
.feature b{
font-size:15px;
}
.feature p{
margin:5px 0 0;
font-size:12px;
color:#9eabc5;
}
.footer{
margin-top:25px;
font-size:11px;
letter-spacing:3px;
color:#66728c;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<img src="logo.png" class="logo" alt="Drag Drive Simulator TH">

<h1>Drag Drive Simulator TH 🇹🇭</h1>

<div class="line"></div>

<div class="desc">
Discord Community สำหรับคนไทย<br>
พูดคุย • เล่นด้วยกัน • หาเพื่อน • แต่งรถ • แข่ง
</div>

<a class="discord" href="https://discord.gg/wUBH4845Ey">
💬 เข้าร่วม Discord
</a>

<div class="features">

<div class="feature">
<div class="icon">🏎️</div>
<b>แต่งรถ</b>
<p>แชร์รถและไอเดียการแต่ง</p>
</div>

<div class="feature">
<div class="icon">🏁</div>
<b>แข่งรถ</b>
<p>ซิ่งและท้าทายเพื่อน</p>
</div>

<div class="feature">
<div class="icon">👥</div>
<b>หาเพื่อนเล่น</b>
<p>หาเพื่อนเล่นด้วยกัน</p>
</div>

<div class="feature">
<div class="icon">🇹🇭</div>
<b>Community</b>
<p>สังคมคนไทย</p>
</div>

</div>

<div class="footer">
THAILAND DISCORD COMMUNITY
</div>

</div>
</div>

</body>
</html>
